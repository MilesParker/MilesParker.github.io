<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Miles Parker</title>
<meta name="description" content="Apps by Miles Parker: support and privacy.">
<style>
  @font-face { font-family: "Plex Mono"; src: url("dialtone/fonts/IBMPlexMono-SemiBold.woff2") format("woff2"); font-weight: 600; font-display: swap; }
  :root { --bg: #fff; --ink: #22262c; --muted: #5d6470; --rule: #e3e6ea; --link: #0072c6; }
  @media (prefers-color-scheme: dark) { :root { --bg: #15181c; --ink: #e8eaed; --muted: #a2a9b4; --rule: #2c3138; --link: #4db3f0; } }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 680px; margin: 0 auto; padding: 48px 16px 64px; }
  h1 { font-family: "Plex Mono", ui-monospace, monospace; font-size: 2rem; margin: 0 0 32px; }
  a.app { display: flex; align-items: center; gap: 20px; padding: 16px 0; border-top: 1px solid var(--rule); color: inherit; text-decoration: none; }
  a.app img { width: 72px; height: 72px; border-radius: 22%; flex: none; }
  a.app strong { font-family: "Plex Mono", ui-monospace, monospace; font-size: 1.2rem; color: var(--link); }
  a.app span { display: block; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Apps</h1>
  <!-- Each app: its own folder beside this page, and a line here. -->
  <a class="app" href="dialtone/">
    <img src="dialtone/icon.png" alt="">
    <div><strong>Dialtone</strong><span>A circle-of-thirds instrument for iPad and iPhone</span></div>
  </a>
</main>
</body>
</html>
